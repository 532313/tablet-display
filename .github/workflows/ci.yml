name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS build and core tests
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          swift --version
          xcodebuild -version
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;36.0.0"
      - name: Build macOS app
        run: ./scripts/build-app.sh
      - name: Verify Apple Silicon-only binary
        run: |
          test "$(uname -m)" = "arm64"
          test "$(lipo -archs build/TabletDisplay.app/Contents/MacOS/TabletDisplay)" = "arm64"
      - name: Core, protocol and socket tests
        run: make test-core
      - name: UI snapshot smoke test
        run: make test-ui
      - name: Package DMG
        run: make dmg
      - name: Verify release artifacts
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/TabletDisplay.app/Contents/Info.plist)"
          dmg="dist/Tablet Display-${version}.dmg"
          test -f "$dmg"
          hdiutil verify "$dmg"
          test "$(lipo -archs build/TabletDisplay.app/Contents/MacOS/TabletDisplay)" = "arm64"
      - uses: actions/upload-artifact@v4
        with:
          name: TabletDisplay-macos-arm64
          path: |
            build/TabletDisplay.app
            dist/*.dmg

  android:
    name: Android build and protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-34" "build-tools;36.0.0"
      - name: Android protocol tests
        run: |
          chmod +x scripts/*.sh
          make test-android
      - name: Build APK
        run: ./scripts/build-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: TabletDisplay-android-apk
          path: build/TabletDisplay.apk
